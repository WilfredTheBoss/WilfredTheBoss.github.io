<button type="button" onclick='
let fontSize = Number(document.getElementById("grow_text").style.fontSize.slice(0, -2));
if (fontSize == 0) {
    fontSize = 20;
} 
else {
    fontSize *= 1.25;
}

if (fontSize < 250) {
    let fontSizeStr = "" + fontSize;
    document.getElementById("grow_text").style.fontSize=fontSizeStr + "px";
}
else {
    document.getElementById("grow_text").style.backgroundImage = "url(\"images/explosion.jpg\")";
    document.getElementById("grow_text").innerHTML = "⠀";
}


'>bigger!</button>
